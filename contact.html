<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact my portfolio">
    <title>My Portfolio | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <nav aria-label="Main navigation">
        <a class="logo" href="index.html">My Portfolio</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>

        <button id="themeToggle" type="button" aria-label="Toggle dark mode">
            Dark Mode
        </button>
    </nav>
</header>

<main>

    <section class="page-intro" aria-labelledby="contact-title">
        <h1 id="contact-title">Contact Me</h1>
        <p>
            Feel free to get in touch with me for opportunities,
            projects or professional discussions.
        </p>
    </section>

    <section class="contact-section" aria-labelledby="form-title">

        <form class="contact-form" action="#" method="post">

            <h2 id="form-title">Send a Message</h2>

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                ></textarea>
            </div>

            <button class="button" type="submit">Send Message</button>

        </form>

    </section>

</main>

<footer class="site-footer">
    <p>&copy; 2026 My Portfolio. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
